<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Search</title>
    <style>
        
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        
        header {
            background-color: #ef5350; 
            width: 100%;
            padding: 40px 20px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-bottom: 5px solid #333;
        }

        header h1 {
            margin: 0 0 20px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .search-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            width: 250px;
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background-color: #3b4cca; 
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #2a3a8c;
            transform: scale(1.05);
        }

        
        main {
            width: 90%;
            max-width: 1000px;
            margin-top: 30px;
        }

        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        th {
            background-color: #333;
            color: white;
            padding: 15px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        td {
            padding: 20px;
            border-bottom: 1px solid #eee;
            text-align: center;
            color: #444;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .pokemon-name {
            font-weight: bold;
            font-size: 1.2rem;
            color: #333;
            text-transform: capitalize;
        }

        .pokemon-id {
            color: #888;
            font-style: italic;
        }

        .description-cell {
            text-align: left;
            max-width: 350px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .type-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin: 2px;
            background-color: #777; 
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .sprite {
            width: 120px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
        }

        .error {
            color: #ef5350;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Pokédex Fetcher</h1>
        <div class="search-container">
            <input id="naam" placeholder="Enter Pokémon name or ID...">
            <button onclick="krijgpokemon()">Search</button>
        </div>
    </header>

    <main id="pomekon_invoerveld">
        </main>

<script>
    async function krijgpokemon() {
        const container = document.getElementById('pomekon_invoerveld');
        const naam = document.getElementById('naam').value.toLowerCase().trim();
        
        if (!naam) return;

        try {
            
            const response = await fetch('https://pokeapi.co/api/v2/pokemon/' + naam);
            if (!response.ok) throw new Error('Not found');
            const pokemon = await response.json();

            
            const speciesResponse = await fetch(pokemon.species.url);
            const speciesData = await speciesResponse.json();

            const descriptionEntry = speciesData.flavor_text_entries.find(entry => entry.language.name === 'en');
            const cleanDescription = descriptionEntry 
                ? descriptionEntry.flavor_text.replace(/[\n\f]/g, ' ') 
                : "No data available.";

            const typesHTML = pokemon.types.map(t => 
                `<span class="type-badge" style="background-color: ${getTypeColor(t.type.name)}">${t.type.name}</span>`
            ).join('');

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Sprite</th>
                            <th>Identity</th>
                            <th>Stats</th>
                            <th>Types</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><img src="${pokemon.sprites.front_default}" class="sprite" alt="${pokemon.name}"></td>
                            <td>
                                <div class="pokemon-name">${pokemon.name}</div>
                                <div class="pokemon-id">#${pokemon.id.toString().padStart(3, '0')}</div>
                            </td>
                            <td>
                                <b>H:</b> ${pokemon.height / 10}m<br>
                                <b>W:</b> ${pokemon.weight / 10}kg
                            </td>
                            <td>${typesHTML}</td>
                            <td class="description-cell">${cleanDescription}</td>
                        </tr>
                    </tbody>
                </table>
            `;

        } catch (error) {
            container.innerHTML = "<p class='error'>❌ Pokémon not found. Try 'Pikachu' or '1'!</p>";
        }
    }


    function getTypeColor(type) {
        const colors = {
            fire: '#F08030', water: '#6890F0', grass: '#78C850', electric: '#F8D030',
            ice: '#98D8D8', fighting: '#C03028', poison: '#A040A0', ground: '#E0C068',
            flying: '#A890F0', psychic: '#F85888', bug: '#A8B820', rock: '#B8A038',
            ghost: '#705898', dragon: '#7038F8', steel: '#B8B8D0', fairy: '#EE99AC',
            normal: '#A8A878'
        };
        return colors[type] || '#777';
    }
</script>

</body>
</html>
